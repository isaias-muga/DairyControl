name: Deploy

# Runs after the CI workflow finishes on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write # push images to ghcr.io
  id-token: write # request the OIDC token for Azure

# One deploy at a time; a newer deploy waits instead of cancelling a running one.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/isaias-muga
  RESOURCE_GROUP: rg-dairycontrol

jobs:
  deploy:
    # Only when CI passed on a push to main (not on pull requests).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        run: |
          docker build -f src/DairyControl.Api/Dockerfile -t "$REGISTRY/dairycontrol-api:$TAG" .
          docker push "$REGISTRY/dairycontrol-api:$TAG"

      - name: Build and push client image
        run: |
          docker build -t "$REGISTRY/dairycontrol-client:$TAG" client
          docker push "$REGISTRY/dairycontrol-client:$TAG"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Deploy API
        run: |
          az containerapp update \
            --name dairycontrol-api \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/dairycontrol-api:$TAG"

      - name: Deploy client
        run: |
          az containerapp update \
            --name dairycontrol-client \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/dairycontrol-client:$TAG"
