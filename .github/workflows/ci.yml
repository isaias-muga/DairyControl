name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DairyControl.slnx

      - name: Build
        run: dotnet build DairyControl.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution DairyControl.slnx --no-build --configuration Release 