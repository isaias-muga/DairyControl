<h2 mat-dialog-title>Registrar recepción</h2>

<mat-dialog-content>
  <app-recepcion-form [proveedorId]="data.proveedorId ?? null" (registrada)="onRegistrada($event)">
    <button formActions mat-button type="button" (click)="cancelar()">Cancelar</button>
  </app-recepcion-form>
</mat-dialog-content>
