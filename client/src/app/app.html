<mat-toolbar class="toolbar">
  <a class="title" routerLink="/resumen">DairyControl</a>
  <span class="spacer"></span>
  @if (auth.isLoggedIn()) {
    <nav class="nav" aria-label="Secciones">
      <a mat-button class="nav-link" routerLink="/resumen" routerLinkActive="active" (isActiveChange)="$event && revelarActiva()">Resumen</a>
      <a mat-button class="nav-link" routerLink="/recepciones" routerLinkActive="active" (isActiveChange)="$event && revelarActiva()">Recepciones</a>
      <a mat-button class="nav-link" routerLink="/proveedores" routerLinkActive="active" (isActiveChange)="$event && revelarActiva()">Proveedores</a>
    </nav>
    <a
      mat-icon-button
      class="config"
      routerLink="/configuracion"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      aria-label="Configuración"
      matTooltip="Configuración"
    >
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" focusable="false">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.484.484 0 0 0 13.9 2h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.72 8.47a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z" />
      </svg>
    </a>
    <button mat-button type="button" class="logout" (click)="auth.logout()">Cerrar sesión</button>
  } @else {
    <a mat-button routerLink="/login">Iniciar sesión</a>
  }
</mat-toolbar>

@if (serverStatus.isWakingUp()) {
  <div class="waking-banner" role="status">
    <mat-spinner diameter="20" />
    <span>El servidor se está iniciando. La primera carga puede tardar hasta un minuto.</span>
  </div>
}

<main class="page">
  <router-outlet />
</main>
