<mat-toolbar color="primary" class="toolbar">
  <a class="title" routerLink="/proveedores">DairyControl</a>
  <span class="spacer"></span>
  @if (auth.isLoggedIn()) {
    <a mat-button routerLink="/proveedores">Proveedores</a>
    <button mat-button type="button" (click)="auth.logout()">Cerrar sesión</button>
  } @else {
    <a mat-button routerLink="/login">Iniciar sesión</a>
  }
</mat-toolbar>

<main class="page">
  <router-outlet />
</main>
