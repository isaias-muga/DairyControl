<mat-toolbar class="toolbar">
  <a class="title" routerLink="/resumen">DairyControl</a>
  <span class="spacer"></span>
  @if (auth.isLoggedIn()) {
    <nav class="nav">
      <a mat-button class="nav-link" routerLink="/resumen" routerLinkActive="active">Resumen</a>
      <a mat-button class="nav-link" routerLink="/recepciones" routerLinkActive="active">Recepciones</a>
      <a mat-button class="nav-link" routerLink="/proveedores" routerLinkActive="active">Proveedores</a>
      <a mat-button class="nav-link" routerLink="/configuracion" routerLinkActive="active">Configuración</a>
    </nav>
    <button mat-button type="button" class="logout" (click)="auth.logout()">Cerrar sesión</button>
  } @else {
    <a mat-button routerLink="/login">Iniciar sesión</a>
  }
</mat-toolbar>

@if (serverStatus.isWakingUp()) {
  <div class="waking-banner" role="status">
    <mat-spinner diameter="20" />
    <span>El servidor se está iniciando. La primera carga puede tardar hasta un minuto.</span>
  </div>
}

<main class="page">
  <router-outlet />
</main>
