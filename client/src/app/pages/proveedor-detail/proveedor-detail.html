<a mat-button routerLink="/proveedores">← Volver</a>

@if (loading()) {
  <div class="state-message">
    <mat-spinner diameter="32" />
    <span>Cargando...</span>
  </div>
} @else if (notFound()) {
  <p class="state-message">Proveedor no encontrado.</p>
} @else if (error()) {
  <p class="form-error" role="alert">{{ error() }}</p>
} @else if (proveedor(); as p) {
  <div class="page-header">
    <h2>{{ p.nombre }}</h2>
    <button mat-flat-button type="button" (click)="abrirRegistro(p.id)">
      Registrar recepción
    </button>
  </div>

  <h3>Recepciones</h3>

  <app-recepciones-panel [proveedorFijo]="p.id" atajoInicial="mes" />
}
