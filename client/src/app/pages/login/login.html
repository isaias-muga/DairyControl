<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput id="username" type="text" formControlName="username" autocomplete="username" />
          @if (form.controls.username.touched && form.controls.username.invalid) {
            <mat-error>Ingresá el usuario.</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <mat-error>Ingresá la contraseña.</mat-error>
          }
        </mat-form-field>

        @if (error()) {
          <p class="form-error" role="alert">{{ error() }}</p>
        }

        <button mat-flat-button type="submit" class="full-width" [disabled]="loading()">
          {{ loading() ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
