<div class="page-header">
  <h2>Proveedores</h2>
  <button mat-flat-button type="button" (click)="abrirCrear()">Nuevo proveedor</button>
</div>

@if (loading()) {
  <div class="state-message">
    <mat-spinner diameter="32" />
    <span>Cargando...</span>
  </div>
} @else if (error()) {
  <p class="form-error" role="alert">{{ error() }}</p>
} @else {
  <mat-card>
    <mat-nav-list>
      @for (p of proveedores(); track p.id) {
        <a mat-list-item [routerLink]="['/proveedores', p.id]">
          <span matListItemTitle>{{ p.nombre }}</span>
          <span matListItemLine>({{ p.cantidadRecepciones }} recepciones)</span>
        </a>
        @if (!$last) {
          <mat-divider />
        }
      } @empty {
        <mat-list-item>
          <span matListItemTitle>No hay proveedores cargados.</span>
        </mat-list-item>
      }
    </mat-nav-list>
  </mat-card>
}
