services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/DairyControl.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Server=db;Database=DairyControl;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      AdminUser__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Database__ApplyMigrationsOnStartup: "true"
      HttpsRedirection__Enabled: "false"
      DemoData__SeedOnStartup: "true"

  client:
    build: ./client
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  sqldata:
